name: Validate learning workspace
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate JSON and shell scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  json.loads(p.read_text())
          PY
          while IFS= read -r -d '' f; do bash -n "$f"; done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
