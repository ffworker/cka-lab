name: Notify private documentation validation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**


permissions:
  contents: read

jobs:
  notify-bytegeist-docs:
    name: Trigger aggregate documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Require dedicated dispatch credential
        env:
          DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo '::error::Configure DOCS_DISPATCH_TOKEN with Contents: Read and write on ffworker/bytegeist-docs.'
            exit 1
          fi
      - name: Send source metadata only
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'ffworker',
              repo: 'bytegeist-docs',
              event_type: 'docs-source-updated',
              client_payload: {
                source_repository: context.repo.repo,
                source_ref: context.ref,
                source_sha: context.sha
              }
            })
