---
- name: Check whether the control plane is initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Initialize the control plane
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - "--node-name={{ inventory_hostname }}"
      - "--apiserver-advertise-address={{ ansible_host }}"
      - "--pod-network-cidr={{ pod_network_cidr }}"
      - --cri-socket=unix:///run/containerd/containerd.sock
  when: not kubeadm_admin_conf.stat.exists
  changed_when: true

- name: Download the pinned Flannel manifest
  ansible.builtin.get_url:
    url: "https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml"
    dest: /etc/kubernetes/kube-flannel.yml
    mode: "0644"

- name: Install or reconcile Flannel
  ansible.builtin.command: kubectl apply -f /etc/kubernetes/kube-flannel.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: flannel_apply
  changed_when: "'configured' in flannel_apply.stdout or 'created' in flannel_apply.stdout"

- name: Publish a short-lived worker join command
  ansible.builtin.command: kubeadm token create --ttl 30m --print-join-command
  register: kubeadm_join
  changed_when: true
  no_log: true

- name: Store the join command for worker hosts
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ kubeadm_join.stdout }}"
  no_log: true

- name: Fetch the administrator kubeconfig
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ local_kubeconfig_path }}"
    flat: true
  no_log: true
